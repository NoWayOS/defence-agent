# The reviewed allow file for `make secrets` (gate B1). The scan -
# nowayos/tools/secrets-scan - reads this repository's tree and every commit on
# every ref for keys and credentials, and fails on any finding not allowed here.
#
# Each [[allow]] entry names exactly one finding as the scan printed it: its
# rule, its file (path) - or, for a commit message, its commit (the full
# hash) - and its fingerprint (a hash of the matched text: the text itself
# never appears here or in the scan's output), with the reason it is not a
# secret. An entry that matches no finding fails the scan, so this file never
# outlives what it allows. Adding an entry loosens a gate: it goes to the
# Product Owner (OWNERS.md). A real secret is never allowed here: remove it and
# rotate it.
#
# [[allow]]
# rule = "private-key"
# path = "fixtures/throwaway-key.pem"
# fingerprint = "0123456789abcdef"
# reason = "Generated for a planted pull request and used nowhere else: it protects nothing."
