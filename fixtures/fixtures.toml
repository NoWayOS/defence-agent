# The fixtures, made by tools/make-fixtures: for each, its patch, the open
# repository it is for and the commit it was made against, the threat it
# plants (THREATS.md; "-" for a real change), what it does, and what
# tools/check-patch must find: each gate that does not pass, "fail" or
# "maintainer". A real past change expects nothing: it passes every gate.
# make test (tools/test_check_patch.py) checks every one.

